# Render Blueprint — one web service, the whole app.
# Deploy: Render Dashboard → New → Blueprint → connect Mike-Demo/black-box.
# Or: render.com/deploy?repo=https://github.com/Mike-Demo/black-box
#
# Before judging week: the free plan spins down after inactivity (first
# hit takes ~1 min to wake). The starter plan keeps the demo warm —
# that plan choice is a billing decision for the repo owner.
services:
  - type: web
    name: black-box
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      # The hosted demo serves the same Gemma 4 weights via an
      # OpenAI-compatible endpoint (Render has no GPU for local Ollama).
      # The UI labels this "Demo mode" wherever it applies.
      - key: GEMMA_PROVIDER
        value: hosted
      - key: GEMMA_HOSTED_BASE_URL
        value: https://openrouter.ai/api/v1
      # Gemma 4 31B, paid slug: OpenRouter's free pools (both the 31B
      # and the 26B-A4B MoE variants) returned HTTP 429 on every live
      # test call on 2026-10-19. The paid slug costs $0.20/$0.40 per
      # million tokens — a reframe or score call is a fraction of a
      # cent — and skips the free-pool throttling entirely.
      - key: GEMMA_HOSTED_MODEL
        value: google/gemma-4-31b-it
      - key: GEMMA_HOSTED_API_KEY
        sync: false
